<!DOCTYPE html>
<html>
<head>
  <title>My Superhero Card</title>
  <style>

    /* Typography — font, size, weight, colour for the whole page */
    body {
      background-color: darkblue;
      color: white;

      /* TODO: Add the font-family property to the body selector to use Arial, sans-serif fonts */
      font-family:Arial, Helvetica, sans-serif
    }




    /* Typography + Text Shadow — big bold title with an orange shadow */
    .hero-name {
      font-size: 60px;
      color: yellow;

      /* TODO: Make the text bold and add a text shadow of 3px 3px in orange */
      font-weight: bold;


    }




    /* Typography + Text Transform — tagline becomes Title Case */
    .tagline {
      color: lightblue;
      text-transform: capitalize;

      /* TODO: Make the text italic */
      font-style: italic;
    }



    /* Text Transform + Text Decoration — section headings in CAPS with underline */
    .label {
      color: coral;

      /* TODO: Make the text uppercase and underlined */
      text-transform:uppercase; 
      text-decoration: underline;
      
    }



    /* Typography — powers stand out in bold green */
    .power {
      font-weight: bold;
      color: lightgreen;
    }



    /* Text Decoration — weaknesses are crossed out */
    .weakness {
      /* TODO: Add a line-through text decoration */
      text-decoration:line-through;
      color: gray;
    }


    /* Transform — the badge is tilted to the side */
    .badge {
      font-size: 28px;
      font-weight: bold;
      color: gold;

      /* TODO: Add a transform property to rotate the badge 15 degrees */
      transform:rotate(15deg);
    }

    

    /* Typography — footer text */
    .made-by {
      color: coral;
      font-style: italic;
    }

  </style>
</head>
<body>

  <h1 class="hero-name">Thunder Kid</h1>
  <p class="tagline">the most powerful hero in the school</p>

  <h2 class="label">super powers</h2>
  <p class="power">Can run faster than a cheetah</p>
  <p class="power">Can lift a school bus</p>

  <h2 class="label">weaknesses</h2>
  <p class="weakness">Maths homework</p>
  <p class="weakness">Broccoli</p>

  <p class="badge">Top Hero</p>

  <p class="made-by">Created by Syed Salman E Rahman</p>

</body>
</html>
